[package]
name = "mini-dbs"
version = "0.1.0"
edition = "2021"
description = "Lightweight, zero-admin, CLI-first database manager for Windows"
license = "MIT"
repository = "https://github.com/pgwiz/mini-dbs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "2.10", features = ["tls", "gzip"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
colored = "2.1"
dirs = "5.0"
winreg = "0.52"
